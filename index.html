<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Sanyog Group | Civil, Road & Infrastructure Works</title>

    <meta
      name="description"
      content="Sanyog Group provides civil works, road construction, electrical works, infrastructure development and utility services across India."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://sanyoggroup.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/images/sanyog-logo-1.png"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Sanyog Group | Civil, Road & Infrastructure Works"
    />

    <meta
      property="og:description"
      content="Sanyog Group delivers civil, road, electrical and infrastructure development works with a focus on quality and reliable project delivery."
    />

    <meta
      property="og:url"
      content="https://sanyoggroup.in/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="https://sanyoggroup.in/images/sanyog-logo-1.png"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Sanyog Group | Civil, Road & Infrastructure Works"
    />

    <meta
      name="twitter:description"
      content="Civil works, road construction, electrical works and infrastructure development by Sanyog Group."
    />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
